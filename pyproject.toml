[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anix-ctx"
version = "0.1.0"
description = "Interactive context packager for LLMs with dark neon TUI (ANIX ecosystem)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ANIX Team" }
]
keywords = ["llm", "context", "tui", "cli", "markdown", "textual", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.40.0",
    "pathspec>=0.12.0",
    "pyperclip>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/an1zy/anix-ctx"
Repository = "https://github.com/an1zy/anix-ctx"
Issues = "https://github.com/an1zy/anix-ctx/issues"
Changelog = "https://github.com/an1zy/anix-ctx#changelog"
PyPI = "https://pypi.org/project/anix-ctx/"

[project.scripts]
anix-ctx = "anix_ctx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anix_ctx"]
